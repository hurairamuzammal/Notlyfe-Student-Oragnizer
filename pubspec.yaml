name: notlyfe
description: "Open-source, end-to-end encrypted workspace for courses, tasks, and rich-text notes."
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_login: ^7.0.0
  supabase_flutter: ^2.8.3
  flutter_colorpicker: ^1.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.3
  animated_analog_clock: ^0.2.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.5
  syncfusion_flutter_calendar: ^28.1.37
  file_picker: ^9.0.1
  http: ^1.2.2
  flutter_ai_toolkit: ^0.6.7
  connectivity_plus: ^6.1.3
  animated_text_kit: ^4.2.3
  mime: ^2.0.0
  fluttertoast: ^8.2.10
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.32
  path: ^1.9.0
  hijri: ^3.0.0
  internet_connection_checker: ^3.0.1
  shared_preferences: ^2.5.2
  open_file: ^3.5.10
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.3.3
  encrypt: ^5.0.3
  crypto: ^3.0.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  dynamic_color: ^1.7.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_quill: ^11.6.0
  xml: ^6.5.0
  googleapis_auth: ^2.3.5
  google_generative_ai: ^0.4.6

flutter_native_splash:
  color: "#000000"
  image: assets/logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/login2.png
    - assets/default.png
    - assets/signup2.png
    - assets/splash.png
    - assets/koala3.png
    - assets/icon/logo.png
    - assets/icon/background.png
    - assets/icon/monochrome.png
    - assets/icon/monochrome-2.png
    - assets/icon/monochrome_3.png
    - assets/koala2.png
    - assets/elephant2.png
    - assets/cardImages/web.png
    - assets/cardImages/cn.png
    - assets/cardImages/db.png
    - assets/cardImages/ds.png
    - assets/cat2.png
